name: One-time cleanup of consumed CAD binary transfer artifacts
on:
  push:
    branches:
      - experiment/chat-freecad-portable-20261018
    paths:
      - .github/workflows/one-time-cad-artifact-cleanup.yml
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete exactly four previously consumed transfer artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in 12120069280 12120109491 12120940112 12120962896 12121454434 12132657107; do
            echo "Removing consumed artifact $id"
            if gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" >/dev/null 2>&1; then
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            else
              echo "Already absent: $id"
            fi
          done
