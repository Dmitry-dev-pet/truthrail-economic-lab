name: Delete verified chat transfer artifact

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: verified-chat-artifact-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  verified-consumption:
    if: >-
      github.repository == 'Dmitry-dev-pet/truthrail-economic-lab' &&
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[artifact] handoff-consumed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - name: Checkout reviewed default-branch implementation
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm owner attestation and delete one exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ops/verified_artifact_cleanup.py
