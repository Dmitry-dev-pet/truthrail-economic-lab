name: Validate Economic Lab research model

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone exactly published independent research model
        shell: bash
        run: |
          set -euo pipefail
          git -c credential.helper= clone --depth 1 --branch v1.0 \
            https://github.com/fhoces/opa-ai-macro-econ-scenarios.git "$RUNNER_TEMP/reproduction"
          test "$(git -C "$RUNNER_TEMP/reproduction" rev-parse HEAD)" = \
            d4703b6ae0d19dca08fbde11a25c218fa4c7b7a6
      - name: Verify lab and model tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/reproduction:$GITHUB_WORKSPACE"
          python -m unittest discover -s tests -v
      - name: Run fixed 2030 scenarios in a credential-free child
        shell: bash
        run: |
          set -euo pipefail
          python ops/mac/economic_lab_verify/verify.py > "$RUNNER_TEMP/economic-receipt.json"
          python - "$RUNNER_TEMP/economic-receipt.json" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1], encoding="utf-8"))
          assert p["verified"] is True
          assert p["country"] == "USA"
          assert p["conditional_scenarios_not_forecasts"] is True
          assert p["source_commit"] == "d4703b6ae0d19dca08fbde11a25c218fa4c7b7a6"
          assert set(p["scenarios"]) == {"modest", "substantial", "extreme"}
          for name, x in p["scenarios"].items():
              print(name, x)
          PY

      - name: Verify fixed two-axis economic experiment
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/reproduction:$GITHUB_WORKSPACE"
          python -m lab.experiment > "$RUNNER_TEMP/economic-grid.json"
          python - "$RUNNER_TEMP/economic-grid.json" <<'PY'
          import json, math, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["metadata"]["source_commit"] == "d4703b6ae0d19dca08fbde11a25c218fa4c7b7a6"
          assert data["metadata"]["geography"] == "USA"
          assert data["metadata"]["model_runs"] == 10
          assert data["assumptions"]["scenario"] == "substantial"
          assert len(data["cells"]) == 9
          assert data["assumptions"]["axes"] == {
              "psi": [0.25, 0.5, 0.75],
              "mu": [0.03, 0.06, 0.12],
          }
          for cell in data["cells"]:
              assert set(cell["summary_2030"]) == set(data["baseline"]["summary_2030"])
              assert all(math.isfinite(x) for x in cell["summary_2030"].values())
              assert all(math.isfinite(x) for x in cell["delta_vs_baseline_pp"].values())
          print("Verified 9 bounded scenario cells against a single pinned-model baseline")
          print("psi,mu,gdp_gain_pct,labor_share_pct,unemployment_total_pct,unemployment_sensitive_pct")
          for cell in data["cells"]:
              x = cell["coordinates"]
              y = cell["summary_2030"]
              print(f'{x["psi"]:.3f},{x["mu"]:.3f},{y["gdp_gain_pct"]:.4f},{y["labor_share_pct"]:.4f},{y["unemployment_total_pct"]:.4f},{y["unemployment_sensitive_pct"]:.4f}')
          PY

      - name: Verify model-generated hypothesis plan and directional comparisons
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/reproduction:$GITHUB_WORKSPACE"
          python -m lab.research > "$RUNNER_TEMP/economic-research.json"
          python - "$RUNNER_TEMP/economic-research.json" <<'PY'
          import json, math, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          plan = data["research"]
          exp = data["experiment"]
          assert plan["plan"]["selected"]["id"] == "new_tasks_vs_automation"
          assert len(plan["plan_sha256"]) == 64
          assert plan["planned_model_evaluations"] == 10
          assert exp["metadata"]["model_runs"] == 10
          assert exp["metadata"]["source_commit"] == "d4703b6ae0d19dca08fbde11a25c218fa4c7b7a6"
          assert len(exp["cells"]) == 9
          assert len(data["tests"]) == 3
          for test in data["tests"]:
              assert len(test["controlled_comparisons"]) == 3
              assert all(math.isfinite(c["observed_delta_pp"]) for c in test["controlled_comparisons"])
              print(test["axis"], test["metric"], test["outcome"])
              for c in test["controlled_comparisons"]:
                  print("  held", c["held_axis"], c["held_value"], "delta_pp", c["observed_delta_pp"])
          print("Plan SHA-256:", plan["plan_sha256"])
          print("No evidence of real-world causal effects or forecasts is implied")
          PY

      - name: Verify fixed local sensitivity plan
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/reproduction:$GITHUB_WORKSPACE"
          python -m lab.sensitivity > "$RUNNER_TEMP/sensitivity.json"
          python - "$RUNNER_TEMP/sensitivity.json" <<'PY'
          import json, math, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          research = data["research"]
          assert research["plan"]["scenario"] == "substantial"
          assert len(research["plan_sha256"]) == 64
          assert research["planned_model_evaluations"] == 19
          assert data["metadata"]["model_evaluations"] == 19
          assert data["metadata"]["source_commit"] == "d4703b6ae0d19dca08fbde11a25c218fa4c7b7a6"
          assert len(data["measurements"]) == 9
          assert set(data["rankings"]) == set(data["baseline_2030"])
          for key, ranking in data["rankings"].items():
              assert len(ranking) == 9
              assert all(math.isfinite(c["signed_change_pp"]) for c in ranking)
              assert all(c["absolute_change_pp"] >= 0 for c in ranking)
              assert all(ranking[i]["absolute_change_pp"] >= ranking[i+1]["absolute_change_pp"] for i in range(8))
              print("Sensitivity", key, "top 3:", [(c["parameter"], c["signed_change_pp"]) for c in ranking[:3]])
          for sample in data["measurements"]:
              assert sample["low"] <= sample["baseline_value"] <= sample["high"]
              assert len(sample["high_2030"]) == 5
              assert len(sample["low_2030"]) == 5
              assert math.isclose(
                  (sample["high"]-sample["low"])/(sample["allowed_max"]-sample["allowed_min"]),
                  0.10, rel_tol=1e-8,
              )
          print("Verified 19-model, 9-parameter owner sensitivity audit")
          print("Pre-computation sensitivity plan:", research["plan_sha256"])
          PY
