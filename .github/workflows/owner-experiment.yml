name: Owner economic experiment

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  calculate:
    # Owner-authored, exact title. No issue body is executable input.
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[econ] experiment'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: economic-owner-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve pinned public mathematical source
        shell: bash
        run: |
          set -euo pipefail
          git -c credential.helper= clone --depth 1 --branch v1.0 \
            https://github.com/fhoces/opa-ai-macro-econ-scenarios.git "$RUNNER_TEMP/econ-source"
          test "$(git -C "$RUNNER_TEMP/econ-source" rev-parse HEAD)" = \
            d4703b6ae0d19dca08fbde11a25c218fa4c7b7a6
      - name: Compute bounded JSON-only request
        shell: bash
        env:
          ECON_ISSUE_JSON: ${{ github.event.issue.body }}
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/econ-source:$GITHUB_WORKSPACE"
          python -m lab.issue_runner > "$RUNNER_TEMP/economic-report.md"
          test "$(wc -c < "$RUNNER_TEMP/economic-report.md")" -le 20000
      - name: Save bounded report for isolated reporting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economic-owner-report
          path: ${{ runner.temp }}/economic-report.md
          if-no-files-found: ignore
          retention-days: 1

  report:
    needs: calculate
    if: always() && needs.calculate.result != 'skipped'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download bounded report
        id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: economic-owner-report
          path: ${{ runner.temp }}/report
      - name: Report to exact owner issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/report/economic-report.md"
          if [ ! -s "$report" ] || [ "$(wc -c < "$report" 2>/dev/null || echo 20001)" -gt 20000 ]; then
            report="$RUNNER_TEMP/fallback-report.md"
            printf '%s\n' '### Economic Lab · experiment unavailable' '' \
              'The bounded calculation did not produce a verified report. Inspect the linked Actions run. No Mac workload was started.' \
              > "$report"
          fi
          gh issue comment "$ISSUE_NUM" --repo "$GITHUB_REPOSITORY" --body-file "$report"
