      - name: Upload image transfer part 06
        uses: actions/upload-artifact@v4
        with:
          name: python312-image-part-06
          path: transfer/part-06
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload image transfer part 07
