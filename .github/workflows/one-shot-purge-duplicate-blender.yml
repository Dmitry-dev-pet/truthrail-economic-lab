name: One-shot purge duplicate Blender CAD handoff

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-purge-duplicate-blender.yml

permissions:
  contents: read

jobs:
  purge:
    if: >-
      github.repository == 'Dmitry-dev-pet/truthrail-economic-lab' &&
      github.actor == 'Dmitry-dev-pet' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Delete only the explicitly authorized duplicate Blender archive
        uses: actions/github-script@v8
        with:
          script: |
            // One-off owner authorization: purge an unconsumed transfer archive
            // to avoid quota usage. This is NOT a verified-consumer receipt.
            const owner = 'Dmitry-dev-pet';
            const repo = 'truthrail-economic-lab';
            const target = {
              artifact_id: 12120962896,
              run_id: 39087529964,
              name: 'chat-blender-4.5.14-linux-x64',
              bytes: 378046402,
              digest: 'sha256:b054267b8dd9b6744a495e31f5458b7b7816d9cb03d11e90abcb76a8d84a3b47',
              source_sha: '22daa7a70946056aa95178d713640b90df219a99',
              run_name: 'Chat Blender portable transfer (CAD render handoff)',
              run_path: '.github/workflows/chat-blender-portable.yml',
              branch: 'experiment/chat-blender-portable-20261017'
            };
            let artifact;
            try {
              artifact = (await github.rest.actions.getArtifact({
                owner, repo, artifact_id: target.artifact_id
              })).data;
            } catch (err) {
              if (err.status === 404) {
                core.info('Already absent: ' + target.artifact_id);
                await core.summary.addHeading('Blender archive already absent')
                  .addRaw('Artifact 12120962896 is no longer available.').write();
                return;
              }
              throw err;
            }
            const run = (await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: target.run_id
            })).data;
            if (
              artifact.id !== target.artifact_id ||
              artifact.name !== target.name ||
              artifact.size_in_bytes !== target.bytes ||
              artifact.digest !== target.digest ||
              artifact.workflow_run?.id !== target.run_id ||
              artifact.workflow_run?.head_sha !== target.source_sha ||
              run.id !== target.run_id ||
              run.name !== target.run_name ||
              run.path !== target.run_path ||
              run.head_branch !== target.branch ||
              run.head_sha !== target.source_sha ||
              run.status !== 'completed' ||
              run.conclusion !== 'success' ||
              run.actor?.login !== owner ||
              run.repository?.full_name !== owner + '/' + repo
            ) {
              throw new Error('Refusing to delete: artifact/run identity mismatch');
            }
            const deletion = await github.rest.actions.deleteArtifact({
              owner, repo, artifact_id: target.artifact_id
            });
            if (deletion.status !== 204) {
              throw new Error('GitHub did not confirm DELETE 204');
            }
            try {
              await github.rest.actions.getArtifact({
                owner, repo, artifact_id: target.artifact_id
              });
            } catch (err) {
              if (err.status !== 404) throw err;
              const receipt = {
                artifact_id: target.artifact_id,
                producer_run_id: target.run_id,
                deleted_bytes: target.bytes,
                delete_http_status: deletion.status,
                lookup_after_delete: 404,
                reason: 'explicit owner-authorized storage cleanup'
              };
              core.info('BLENDER_PURGE_RECEIPT ' + JSON.stringify(receipt));
              await core.summary.addHeading('Blender archive removed')
                .addRaw('Artifact ID: ' + target.artifact_id + '\\n')
                .addRaw('Size: ' + target.bytes + ' bytes\\n')
                .addRaw('Deletion: HTTP 204; confirmed absent by HTTP 404\\n')
                .write();
              return;
            }
            throw new Error('Artifact still exists after deletion');
