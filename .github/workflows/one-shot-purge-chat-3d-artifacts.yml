name: One-shot purge of four large chat 3D handoff archives

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-purge-chat-3d-artifacts.yml

permissions:
  contents: read

jobs:
  purge:
    if: >-
      github.repository == 'Dmitry-dev-pet/truthrail-economic-lab' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Dmitry-dev-pet'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Preflight and delete only the four owner-approved archive IDs
        uses: actions/github-script@v8
        with:
          script: |
            // Owner explicitly authorizes destruction of these four temporary
            // ChatGPT-transfer ZIPs, even without a consumer verification receipt.
            // This is a one-off owner purge, NOT the normal handoff-consumed path.
            const owner = 'Dmitry-dev-pet';
            const repo = 'truthrail-economic-lab';
            const expected = [
              {
                id: 12107503765,
                name: 'chat-blender-4.5.14-linux-x64',
                bytes: 378046402,
                digest: 'sha256:0e0f41aeb7a0b4905e09c56760927e94bdb22469230faefafec100623f8a97ee',
                runId: 39051371861,
                runName: 'Chat Blender portable transfer',
                runPath: '.github/workflows/chat-blender-portable.yml',
                branch: 'experiment/chat-blender-portable-20261017',
                headSha: 'e4b25b402615de99cc223eedf45a04e5f4f98084'
              },
              {
                id: 12120069280,
                name: 'chat-freecad-1.1.4-linux-x64',
                bytes: 820812696,
                digest: 'sha256:c3f8ea4a217d6dd6fb6120f913fb929e67bf511593900898b0e0e5317fae53f1',
                runId: 39084980421,
                runName: 'Chat FreeCAD portable transfer',
                runPath: '.github/workflows/chat-freecad-portable.yml',
                branch: 'experiment/chat-freecad-portable-20261018',
                headSha: '9e49be5db56b0df83ffd1e12b0b093f03c9d6f28'
              },
              {
                id: 12120109491,
                name: 'chat-freecad-1.1.4-part-00',
                bytes: 420000778,
                digest: 'sha256:e6eb2a2268d574b739b38e3c0d0f81e5a76dcb3344a3ed1df471585db2448c5e',
                runId: 39085112775,
                runName: 'Chat FreeCAD portable transfer (chunked)',
                runPath: '.github/workflows/chat-freecad-portable.yml',
                branch: 'experiment/chat-freecad-portable-20261018',
                headSha: '02c3624ad59beebde813a22de569a7f8f0235a3e'
              },
              {
                id: 12120940112,
                name: 'chat-freecad-1.1.4-part-01',
                bytes: 400812492,
                digest: 'sha256:a5d5adbf706bf7cb07ecd7a145cd34de1d9335b255a74a6b6668d55186217108',
                runId: 39085112775,
                runName: 'Chat FreeCAD portable transfer (chunked)',
                runPath: '.github/workflows/chat-freecad-portable.yml',
                branch: 'experiment/chat-freecad-portable-20261018',
                headSha: '02c3624ad59beebde813a22de569a7f8f0235a3e'
              }
            ];
            if (expected.length !== 4 ||
                new Set(expected.map(x => x.id)).size !== 4) {
              throw new Error('Unsafe purge target list');
            }
            const present = [];
            const gone = [];
            // Preflight ALL targets before making any destructive API call.
            for (const t of expected) {
              let artifact;
              try {
                artifact = (await github.rest.actions.getArtifact({
                  owner, repo, artifact_id: t.id
                })).data;
              } catch (err) {
                if (err.status === 404) {
                  gone.push(t);
                  core.info('Already absent: ' + t.id);
                  continue;
                }
                throw err;
              }
              const run = (await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: t.runId
              })).data;
              if (
                artifact.id !== t.id ||
                artifact.name !== t.name ||
                artifact.size_in_bytes !== t.bytes ||
                artifact.digest !== t.digest ||
                artifact.workflow_run?.id !== t.runId ||
                artifact.workflow_run?.head_sha !== t.headSha ||
                run.id !== t.runId ||
                run.name !== t.runName ||
                run.path !== t.runPath ||
                run.head_branch !== t.branch ||
                run.head_sha !== t.headSha ||
                run.status !== 'completed' ||
                run.conclusion !== 'success' ||
                run.actor?.login !== owner ||
                run.repository?.full_name !== owner + '/' + repo
              ) {
                throw new Error('Refusing delete: provenance mismatch for ' + t.id);
              }
              present.push(t);
            }
            core.info('Exact owner-approved targets present: ' +
              present.map(x => x.id).join(', '));
            const deleted = [];
            for (const t of present) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner, repo, artifact_id: t.id
                });
              } catch (err) {
                if (err.status === 404) {
                  gone.push(t);
                  continue;
                }
                throw err;
              }
              try {
                await github.rest.actions.getArtifact({
                  owner, repo, artifact_id: t.id
                });
              } catch (err) {
                if (err.status !== 404) throw err;
                deleted.push(t);
                continue;
              }
              throw new Error('Deletion not confirmed (artifact still exists): ' + t.id);
            }
            await core.summary
              .addHeading('Owner-authorized one-shot 3D archive purge')
              .addRaw('Only four hard-coded Blender/FreeCAD Actions Artifact IDs were eligible. No unverified consumer acknowledgement was claimed.')
              .addTable([
                [{data:'ID',header:true},{data:'Name',header:true},{data:'State',header:true},{data:'Bytes',header:true}],
                ...expected.map(t=>[
                  String(t.id),
                  t.name,
                  deleted.some(x=>x.id===t.id) ? 'Deleted; GET 404' : 'Already absent',
                  String(t.bytes)
                ])
              ])
              .addRaw('Deleted bytes: ' + deleted.reduce((n,t)=>n+t.bytes,0))
              .write();
            core.info('PURGE_RECEIPT ' + JSON.stringify({
              expected_ids: expected.map(x=>x.id),
              deleted_ids: deleted.map(x=>x.id),
              already_absent_ids: gone.map(x=>x.id),
              deleted_bytes: deleted.reduce((n,t)=>n+t.bytes,0),
              verified_absent: expected.every(x=>deleted.some(d=>d.id===x.id)||gone.some(g=>g.id===x.id))
            }));
