name: Chat Blender portable transfer (CAD render handoff)

on:
  push:
    branches:
      - experiment/chat-blender-portable-20261017
    paths:
      - .github/workflows/chat-blender-portable.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download and verify official Blender 4.5.14 LTS
        shell: bash
        run: |
          set -euo pipefail
          filename="blender-4.5.14-linux-x64.tar.xz"
          base_url="https://download.blender.org/release/Blender4.5"
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 -o "$filename" "$base_url/$filename"
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 -o blender-4.5.14.sha256 "$base_url/blender-4.5.14.sha256"
          grep -F "$filename" blender-4.5.14.sha256 | sha256sum -c -
          tar -tJf "$filename" >/dev/null
          ls -lh "$filename"
      - name: Upload portable Blender archive
        uses: actions/upload-artifact@v4
        with:
          name: chat-blender-4.5.14-linux-x64
          path: |
            blender-4.5.14-linux-x64.tar.xz
            blender-4.5.14.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
