name: Economic Lab fixed mathematical smoke
description: Reproduce three pinned no-secret US economic scenarios without Docker.
outputs:
  result:
    description: Sanitized JSON receipt for published Table 3 reproduction.
    value: ${{ steps.check.outputs.result }}
runs:
  using: composite
  steps:
    - name: Verify pinned public mathematical reproduction
      id: check
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
        PYTHONDONTWRITEBYTECODE: "1"
        PYTHONNOUSERSITE: "1"
      run: |
        set -euo pipefail
        python3 "$ACTION_ROOT/verify.py" > "$RUNNER_TEMP/economic-lab-receipt.json"
        python3 - "$RUNNER_TEMP/economic-lab-receipt.json" <<'PY'
        import json, os, pathlib, sys
        path = pathlib.Path(sys.argv[1])
        receipt = json.loads(path.read_text(encoding="utf-8"))
        assert receipt["verified"] is True
        assert receipt["source_commit"] == "d4703b6ae0d19dca08fbde11a25c218fa4c7b7a6"
        assert set(receipt["scenarios"]) == {"modest", "substantial", "extreme"}
        packed = json.dumps(receipt, ensure_ascii=False, separators=(",", ":"))
        assert len(packed.encode("utf-8")) < 8192
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write("result=" + packed + "\n")
        PY
        rm -f "$RUNNER_TEMP/economic-lab-receipt.json"
